<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <title>Спутник</title>
</head>
<body style="background-image: url('/static/image/sad.jpg'); background-repeat: no-repeat; background-attachment: fixed; background-size: cover; color: white;">
<div style="background-color: rgba(0, 0, 0, 0.6); height: 100vw;">
<form action="" method="post" novalidate>
<p style="height: auto; width: auto;" align="center">{{ form.submit_return(type="submit", class="btn btn-outline-light") }}</p>
</form>
<h1 align="center">Спутник: {{ satellite.name }}</h1>
{% if photo != '' %}
    <p><img src="{{url_for('static', filename=photo[7:])}}" style="max-width: 600px; max-height: 400px; object-fit: cover;"></p>
{% endif %}
{% for x in text %}
<p style="font-size: 20px;">{{ x }}</p>
{% endfor %}
</div>
</body>
</html>
